    - name: Startlister friidrett
      startDate: Aug 2026
      endDate: Sep 2026
      description: |
        Verktøy for å lage gode startlister for tekniske øvelser på friidrettsstevner, 
        samt mulighet for å automatisk fylle ut resultater i etterkant.
      summary: |
        - Henter inn utøverdata fra eksterne kilder
        - Genererer pdf med printbare startlister
        - Inneholder fiducial markers for å kunne rette opp skjeve bilder
        - Klipper ut resultatene og sender minst mulig til AI-tjenester
        - Bruker modell fra både OpenAI og Claude for å tolke de håndskrevne resultatene        
        - Reduserer feil ved at man slipper manuell inntasting
        - Utviklet med god hjelp fra Claude Code og OpenAI Codex
      keywords: [AI-utvikling, Claude API, OpenAI API, TypeScript]
      images:
        - src: images/2026-10-06--07-35-41.jpg
          alt: Skjermbilde av uutfylt startliste for lengde med flere klasser
          caption: Startliste med flere klasser i lengde
        - src: images/2026-09-27--10-50-11.jpg
          alt: Viser skanning av resultater med webkamera
          caption: Skanning av resultater
        - src: images/2026-10-05--11-20-30.jpg
          alt: Skjermbilde av tolkning
          caption: Tolkning av resultater

